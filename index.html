:root{
  --teal:#117F75; --teal-dark:#0B5A53; --ink:#211d1a; --paper:#FBF6E8; --cream:#F6EEDB;
  --red:#D7381F; --red-dark:#8F2A14; --yellow:#FFD84A; --muted:#4a443d; --white:#fff;
  --display:'Chunk Party','Jetsy Trial','Montserrat',sans-serif; --body:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);min-height:100vh;background-color:var(--teal);
  background-image:linear-gradient(rgba(255,255,255,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.18) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
button,input,textarea{font:inherit}
:is(a,button,input,textarea):focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--yellow)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;max-width:1280px;margin:0 auto;padding:22px 20px 0}
.pill-title{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1;padding:12px 34px 16px;border-radius:999px;border:4px solid var(--cream);color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;border:4px solid transparent;cursor:pointer;text-decoration:none;transition:transform .2s cubic-bezier(.3,.9,.25,1),box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.btn-yellow{background:var(--yellow);color:var(--red-dark)}
.btn-red{background:var(--red);color:var(--white)}
.btn-ghost{background:transparent;border-color:var(--cream);color:var(--cream)}
.btn-sm{min-height:40px;padding:0 16px;font-size:12px}

.app{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding:24px 20px 60px;align-items:start}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.panel h2{margin:26px 0 12px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--red)}
.panel h2:first-child{margin-top:0}
.panel label{display:block;margin:0 0 12px;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.panel input,.panel textarea{display:block;width:100%;margin-top:5px;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;background:var(--white);color:var(--ink);text-transform:none;letter-spacing:0}
.panel textarea{min-height:76px;resize:vertical}
.panel input:focus,.panel textarea:focus{border-color:var(--teal)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.item{background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:12px;position:relative}
.item label{margin-bottom:8px}
.item .row3{display:grid;grid-template-columns:70px 1fr;gap:0 10px}
.item .rm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);font-weight:800;cursor:pointer;line-height:1}
.item .d{padding-right:34px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.hint{margin:6px 0 0;font-size:12px;font-weight:600;color:var(--muted)}

/* invoice sheet */
.sheet{background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 rgba(0,0,0,.25);overflow:hidden;max-width:794px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.s-head{background:var(--yellow);padding:clamp(18px,4vw,30px);display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ink)}
.s-head .ttl{display:flex;align-items:center;gap:14px}
.s-head h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1;color:var(--red)}
.s-meta{text-align:right;font-size:13px;font-weight:600;line-height:1.7}
.s-meta b{font-weight:800}
.s-meta .no{font-family:var(--display);font-size:22px;color:var(--red-dark);display:block}
.s-body{padding:clamp(18px,4vw,30px)}
.s-parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
.lbl{display:block;margin-bottom:6px;font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--red-dark)}
.s-parties strong{font-size:17px;font-weight:800}
.s-parties p{margin:2px 0 0;font-size:13px;font-weight:600;line-height:1.55;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--ink);color:var(--yellow);text-align:left;padding:9px 12px;font-size:11px;letter-spacing:2px;text-transform:uppercase}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:12px;border-bottom:2px dashed rgba(0,0,0,.22);font-weight:600;vertical-align:top;overflow-wrap:anywhere}
th.n,td.n{text-align:right;white-space:nowrap}
td.empty{color:var(--muted);font-style:italic}
.s-tot{margin:18px 0 0 auto;width:min(340px,100%);font-size:14px;font-weight:600}
.s-tot div{display:flex;justify-content:space-between;gap:16px;padding:6px 0}
.s-tot .grand{margin-top:6px;padding:12px 14px;background:var(--red);color:var(--white);border-radius:12px;font-size:15px;font-weight:800;align-items:center}
.s-tot .grand span:last-child{font-family:var(--display);font-size:24px;font-weight:400}
.s-tot .dp{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 14px;margin-top:8px;font-weight:800}
.s-foot{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.s-foot p{margin:0;font-size:13px;font-weight:600;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.s-thx{margin-top:26px;padding-top:16px;border-top:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:22px;color:var(--teal)}

@media (max-width:980px){.app{grid-template-columns:1fr}}
@media (max-width:560px){.s-parties,.s-foot,.row{grid-template-columns:1fr}.s-meta{text-align:left}th,td{padding:9px 6px}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .top,.panel{display:none}
  .app{display:block;padding:0;max-width:none}
  .sheet{border:0;border-radius:0;box-shadow:none;max-width:none;min-height:100vh}
}
</style></head><body>

<div class="top">
  <h1 class="pill-title">Invoice</h1>
  <div class="acts" style="margin:0">
    <button class="btn btn-yellow" type="button" id="print">Print / Save PDF</button>
    <button class="btn btn-ghost" type="button" id="reset">Reset</button>
  </div>
</div>

<main class="app">
  <form class="panel" id="form" onsubmit="return false" autocomplete="off">
    <h2>Invoice</h2>
    <label>No. invoice<input data-k="no"></label>
    <div class="row">
      <label>Tanggal<input type="date" data-k="date"></label>
      <label>Jatuh tempo<input type="date" data-k="due"></label>
    </div>

    <h2>Klien</h2>
    <label>Nama<input data-k="cname" placeholder="Nama klien / brand"></label>
    <label>Kontak / alamat<textarea data-k="ccontact" placeholder="Email, WA, atau alamat"></textarea></label>

    <h2>Item</h2>
    <div id="items"></div>
    <div class="acts"><button class="btn btn-red btn-sm" type="button" id="add">+ Tambah item</button></div>
    <datalist id="svc"></datalist>
    <p class="hint">Pilih nama layanan dari daftar ratecard, harga otomatis terisi batas bawah (bisa diubah).</p>
    <div class="row" style="margin-top:14px">
      <label>Diskon (Rp)<input type="number" min="0" step="1000" data-k="disc"></label>
      <label>DP (%)<input type="number" min="0" max="100" step="5" data-k="dp"></label>
    </div>

    <h2>Pengirim &amp; pembayaran</h2>
    <label>Nama<input data-k="from"></label>
    <label>Kontak<textarea data-k="fromContact"></textarea></label>
    <label>Info pembayaran<textarea data-k="pay"></textarea></label>
    <label>Catatan<textarea data-k="notes"></textarea></label>
    <p class="hint">Semua isian tersimpan di browser ini saja.</p>
  </form>

  <article class="sheet" id="sheet" aria-label="Pratinjau invoice"></article>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rp = (n) => 'Rp' + Math.round(n).toLocaleString('id-ID');
const day = (d) => { const x = new Date(d + 'T00:00'); return isNaN(x) ? '-' : x.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); };
const iso = (d) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

/* ratecard presets: [layanan, harga batas bawah] */
const SVC = [['Tipografi / Layout', 75000], ['Ilustrasi Simpel', 150000], ['Ilustrasi Karakter Full', 350000], ['Paket Set Merch', 700000], ['Chibi / Sticker Pack', 150000], ['Mockup Tambahan', 15000], ['Revisi tambahan', 25000], ['File mentah (AI/PSD)', 0], ['Lisensi komersial', 0], ['Biaya deadline kilat', 0]];
$('#svc').innerHTML = SVC.map((s) => '<option value="' + esc(s[0]) + '">').join('');

const fresh = () => {
  const t = new Date(), due = new Date(t.getTime() + 7 * 864e5);
  return {
    no: 'INV-' + iso(t).replace(/-/g, '') + '-01', date: iso(t), due: iso(due),
    cname: '', ccontact: '', items: [{ d: '', q: 1, p: 0 }], disc: 0, dp: 50,
    from: 'Willi Prabowo Endi', fromContact: 'Illustrator & Graphic Designer, Yogyakarta\nwilliprabowoendi@gmail.com\nIG @inipauss',
    pay: 'Bank / e-wallet: \nNo. rekening: \na.n. Willi Prabowo Endi',
    notes: 'DP 50% di awal, pelunasan sebelum file final dikirim.\nRevisi: 2 kali gratis.'
  };
};
let S = fresh();
try { const j = JSON.parse(localStorage.getItem('inv') || 'null'); if (j && Array.isArray(j.items)) S = { ...S, ...j }; } catch (e) {}
const save = () => { try { localStorage.setItem('inv', JSON.stringify(S)); } catch (e) {} };

function renderItems() {
  $('#items').innerHTML = S.items.map((it, i) => '<div class="item"><button class="rm" type="button" data-rm="' + i + '" aria-label="Hapus item ' + (i + 1) + '">&times;</button>'
    + '<label class="d">Deskripsi<input list="svc" data-i="' + i + '" data-f="d" value="' + esc(it.d) + '" placeholder="Ilustrasi, layout, dll"></label>'
    + '<div class="row3"><label>Qty<input type="number" min="0" step="1" data-i="' + i + '" data-f="q" value="' + it.q + '"></label>'
    + '<label>Harga satuan (Rp)<input type="number" min="0" step="1000" data-i="' + i + '" data-f="p" value="' + it.p + '"></label></div></div>').join('');
}
function bindForm() {
  document.querySelectorAll('[data-k]').forEach((el) => { el.value = S[el.dataset.k]; });
}

function render() {
  const rows = S.items.filter((it) => it.d || it.p);
  const sub = rows.reduce((a, it) => a + it.q * it.p, 0);
  const disc = Math.min(S.disc, sub), total = sub - disc;
  const dp = Math.round(total * Math.min(Math.max(S.dp, 0), 100) / 100);
  $('#sheet').innerHTML =
    '<div class="s-head"><div class="ttl"><h1>Invoice</h1></div>'
    + '<div class="s-meta"><span class="no">' + esc(S.no || '-') + '</span><b>Tanggal:</b> ' + day(S.date) + '<br><b>Jatuh tempo:</b> ' + day(S.due) + '</div></div>'
    + '<div class="s-body"><div class="s-parties">'
    + '<div><span class="lbl">Dari</span><strong>' + esc(S.from) + '</strong><p>' + esc(S.fromContact) + '</p></div>'
    + '<div><span class="lbl">Ditagihkan ke</span><strong>' + esc(S.cname || '-') + '</strong><p>' + esc(S.ccontact) + '</p></div></div>'
    + '<table><thead><tr><th>Deskripsi</th><th class="n">Qty</th><th class="n">Harga</th><th class="n">Jumlah</th></tr></thead><tbody>'
    + (rows.length ? rows.map((it) => '<tr><td>' + esc(it.d || '-') + '</td><td class="n">' + it.q + '</td><td class="n">' + rp(it.p) + '</td><td class="n">' + rp(it.q * it.p) + '</td></tr>').join('') : '<tr><td class="empty" colspan="4">Belum ada item</td></tr>')
    + '</tbody></table>'
    + '<div class="s-tot"><div><span>Subtotal</span><span>' + rp(sub) + '</span></div>'
    + (disc ? '<div><span>Diskon</span><span>- ' + rp(disc) + '</span></div>' : '')
    + '<div class="grand"><span>Total</span><span>' + rp(total) + '</span></div>'
    + (S.dp > 0 && S.dp < 100 ? '<div class="dp"><span>DP ' + S.dp + '%</span><span>' + rp(dp) + '</span></div><div><span>Sisa pelunasan</span><span>' + rp(total - dp) + '</span></div>' : '')
    + '</div>'
    + '<div class="s-foot"><div><span class="lbl">Pembayaran</span><p>' + esc(S.pay) + '</p></div><div><span class="lbl">Catatan</span><p>' + esc(S.notes) + '</p></div></div>'
    + '<div class="s-thx">Terima kasih &#10022;</div></div>';
  save();
}

$('#form').addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.k) { const k = el.dataset.k; S[k] = el.type === 'number' ? Math.max(0, Number(el.value) || 0) : el.value; }
  else if (el.dataset.f) {
    const it = S.items[el.dataset.i], f = el.dataset.f;
    if (f === 'd') {
      it.d = el.value;
      const s = SVC.find((x) => x[0] === el.value);
      if (s && !it.p && s[1]) { it.p = s[1]; el.closest('.item').querySelector('[data-f=p]').value = s[1]; }
    } else it[f] = Math.max(0, Number(el.value) || 0);
  }
  render();
});
$('#form').addEventListener('click', (e) => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { S.items.splice(Number(rm.dataset.rm), 1); if (!S.items.length) S.items.push({ d: '', q: 1, p: 0 }); renderItems(); render(); }
});
$('#add').onclick = () => { S.items.push({ d: '', q: 1, p: 0 }); renderItems(); render(); const l = document.querySelectorAll('#items [data-f=d]'); l[l.length - 1].focus(); };
$('#print').onclick = () => print();
$('#reset').onclick = () => { if (confirm('Kosongkan semua isian dan mulai invoice baru?')) { S = fresh(); bindForm(); renderItems(); render(); } };

bindForm(); renderItems(); render();
</script>
</body></html>
